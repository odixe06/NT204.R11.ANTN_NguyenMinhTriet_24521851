# file này chứa nội dung cấu hình mặc định

# giới hạn nội dung phần body parser lưu lại vào event
parser:
  max_body_bytes: 65536

# thời gian timeout khi k nhận packet mới đối với flow
flow:
  tcp_idle_timeout: 120
  udp_idle_timeout: 30

# keep/drop gói tin khi preprocessed xử lý
preprocess:
  invalid_policy: keep
  unsupported_policy: keep

# nạp rule cho detection; đường dẫn tương đối tính theo thư mục chạy lệnh
detection:
  # các file .rules được nạp (list trong YAML thay thế toàn bộ list mặc định)
  rule_files:
    - rules/local.rules
  # file nằm trong rule_files nhưng tạm tắt
  disabled_files: []
  # sid của các rule bị tắt
  disabled_sids: []
